# This package's tests, in `tests/`: the scripts' own logic on its own, and the
# package used the way a workspace uses it, through PartCAD.
#
# The two are separate jobs because they answer separate questions. The first
# needs nothing but pytest and says whether the scripts are right. The second
# installs PartCAD and builds real parts -- downloading SolidCraft, or using
# the published image where PartCAD's `docker` sandbox picks it up -- and says
# whether this package still works with the PartCAD it is used with.
name: Test

on:
  workflow_dispatch:
    inputs:
      partcad:
        description: "The PartCAD to test against, as a pip requirement"
        default: "partcad @ git+https://github.com/partcad/partcad.git@devel"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # PartCAD moves; this package does not. Running nightly against PartCAD's
    # development branch is what finds a change there that breaks this plugin
    # before a release ships it.
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The interpreter PartCAD runs a package's scripts on by default.
  PYTHON_VERSION: "3.11"
  # This package needs partTypes that read a file, which PartCAD's development
  # branch has ahead of a release that does.
  PARTCAD: ${{ inputs.partcad || 'partcad @ git+https://github.com/partcad/partcad.git@devel' }}

jobs:
  scripts:
    name: "The scripts, without PartCAD"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest
      # Without PartCAD installed, the tests that need it skip themselves.
      - run: python -m pytest -m "not slow"

  partcad:
    name: "The package, through PartCAD"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest "${PARTCAD}"
      - run: python -m pytest
